<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1E25;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moonGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7BB3DB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8BC9A7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B299D3;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>

  <!-- Large Crescent Moon -->
  <path d="M 60 35 A 45 45 0 0 1 60 145 A 36 36 0 0 0 60 35 Z"
        fill="url(#moonGradient2)"
        filter="url(#softGlow)"
        opacity="0.95"/>

  <!-- Decorative stars -->
  <circle cx="120" cy="50" r="3" fill="#F9D95B" opacity="0.9"/>
  <circle cx="135" cy="75" r="2.5" fill="#F9D95B" opacity="0.7"/>
  <circle cx="128" cy="110" r="3.5" fill="#F9D95B" opacity="0.8"/>
  <circle cx="110" cy="135" r="2" fill="#F9D95B" opacity="0.6"/>
  <circle cx="145" cy="130" r="2" fill="#7DD4DE" opacity="0.5"/>
</svg>
