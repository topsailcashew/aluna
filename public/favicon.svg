<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7BB3DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B299D3;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0A0E15"/>

  <!-- Crescent Moon -->
  <path d="M 35 20 A 25 25 0 0 1 35 80 A 20 20 0 0 0 35 20 Z"
        fill="url(#moonGradient)"
        filter="url(#glow)"
        opacity="0.95"/>

  <!-- Small stars -->
  <circle cx="65" cy="30" r="2" fill="#F9D95B" opacity="0.8"/>
  <circle cx="72" cy="45" r="1.5" fill="#F9D95B" opacity="0.6"/>
  <circle cx="68" cy="65" r="2" fill="#F9D95B" opacity="0.7"/>
  <circle cx="58" cy="75" r="1" fill="#F9D95B" opacity="0.5"/>
</svg>
